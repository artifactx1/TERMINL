name: Isolated mint rehearsal
on:
  push:
    branches: [testing/isolated-mint-rehearsal-2026-10-27]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: isolated-mint-rehearsal
  cancel-in-progress: true
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/terminl-browsers
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install locked dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium webkit
      - name: Build and rehearse with all external networking disabled
        run: |
          sudo --preserve-env=PATH,PLAYWRIGHT_BROWSERS_PATH unshare --net bash -c 'ip link set lo up; exec node scripts/mint-rehearsal.mjs'
