name: Isolated mint rehearsal
on:
  push:
    branches: [testing/isolated-mint-rehearsal-2026-10-27]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: isolated-mint-rehearsal
  cancel-in-progress: true
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/terminl-browsers
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install locked dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Install browsers
        timeout-minutes: 5
        run: |
          # The runner's Azure HTTP mirror timed out. Use Ubuntu's signed HTTPS archive.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' 'Acquire::Retries "0";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99-terminl-rehearsal > /dev/null
          npx --no-install playwright install --with-deps chromium webkit
      - name: Build and rehearse with all external networking disabled
        run: |
          sudo --preserve-env=PATH,PLAYWRIGHT_BROWSERS_PATH unshare --net bash -c 'ip link set lo up; exec node scripts/mint-rehearsal.mjs'
